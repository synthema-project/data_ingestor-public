---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-pv-node1    # Unique name for each PV
  labels:
    type: local
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /mnt/data/local-storage   # Path on the node
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: node-ip
          operator: In
          values:
          - IP1    # Change for each node
